<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- Privacy: the app may only talk to itself. The single exception is the optional,
       one-time offline voice model download (you are asked first). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data: https://ccoreilly.github.io; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#121417">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Build Calc</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="hand-right">
  <div id="app">
    <header class="topbar">
      <h1 id="screen-title">Basic</h1>
      <button id="job-chip" class="chip" aria-label="Active job">No job</button>
      <button id="btn-settings" class="icon-btn" aria-label="Settings">⚙</button>
    </header>

    <main id="screens">
      <section id="screen-basic" class="screen active" aria-label="Basic calculator"></section>
      <section id="screen-build" class="screen" aria-label="Construction calculator"></section>
      <section id="screen-sci" class="screen" aria-label="Scientific calculator"></section>
      <section id="screen-sketch" class="screen" aria-label="Sketch pad"></section>
      <section id="screen-jobs" class="screen" aria-label="Saved jobs"></section>
    </main>

    <nav class="tabbar" aria-label="Screens">
      <button data-screen="basic" class="active"><span class="ti">±</span><span>Basic</span></button>
      <button data-screen="build"><span class="ti">📐</span><span>Build</span></button>
      <button data-screen="sci"><span class="ti">ƒx</span><span>Sci</span></button>
      <button data-screen="sketch"><span class="ti">✎</span><span>Sketch</span></button>
      <button data-screen="jobs"><span class="ti">🗂</span><span>Jobs</span></button>
    </nav>
  </div>

  <div id="voice-overlay" class="voice-overlay hidden" role="status" aria-live="polite">
    <div class="voice-card">
      <div class="pulse" aria-hidden="true"></div>
      <div id="voice-text" class="voice-text">Listening…</div>
      <div id="voice-hint" class="muted small"></div>
      <button id="voice-stop" class="btn primary">Done</button>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
